<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Админ-панель | Редактор расписания</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', monospace; }
        body {
            background: #1a2634;
            padding: 20px 16px 40px;
            color: #eef2fb;
        }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .admin-card {
            background: #0f1722;
            border-radius: 40px;
            padding: 24px 20px;
            margin-bottom: 28px;
            box-shadow: 0 20px 35px -12px black;
        }
        h2 { font-size: 1.6rem; margin-bottom: 18px; font-weight: 600; letter-spacing: -0.3px; color: #b9e2ff; }
        .group-row, .day-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        select, button, input {
            background: #232e3c;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select { background: #2d3b4b; cursor: pointer; }
        button {
            background: #2c5f8a;
            transition: 0.1s linear;
        }
        button:active { transform: scale(0.97); background: #1f4a6e; }
        .danger-btn { background: #9e3b2f; }
        .success-btn { background: #2c7840; }
        .lesson-list {
            margin-top: 25px;
            background: #0a0f16;
            border-radius: 32px;
            padding: 8px 0;
        }
        .lesson-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #2a3645;
            background: #111a24;
            margin: 8px 0;
            border-radius: 60px;
        }
        .lesson-item input {
            flex: 2;
            min-width: 110px;
            background: #1e2a36;
        }
        .lesson-item input.time-input { flex: 0.8; min-width: 100px; }
        .lesson-item input.subject-input { flex: 3; }
        .delete-lesson {
            background: #7a2e24;
            border-radius: 40px;
            padding: 8px 16px;
        }
        .add-lesson {
            margin: 20px 0 10px;
            background: #1f5e3a;
            width: 100%;
        }
        hr { border-color: #2f3e4e; margin: 16px 0; }
        .info-note { font-size: 0.8rem; opacity: 0.7; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-card">
        <h2>🧑‍🏫 Админ-панель: Редактор расписания</h2>
        <div class="group-row">
            <span>📚 Группа:</span>
            <select id="adminGroupSelect">
                <option value="2-25Пб">2-25Пб</option>
                <option value="7-25Лб">7-25Лб</option>
                <option value="8-25Мб">8-25Мб</option>
                <option value="9-25Руб">9-25Руб</option>
                <option value="19-25ППб">19-25ППб</option>
                <option value="49-25ОП">49-25ОП</option>
            </select>
        </div>
        <div class="day-row">
            <span>📆 День:</span>
            <button id="adminDayTodayBtn" style="background:#3a6b92;">Сегодня</button>
            <button id="adminDayTomorrowBtn">Завтра</button>
        </div>
        <div id="lessonsEditorPanel">
            <!-- сюда динамически грузим список пар -->
        </div>
        <button id="publishBtn" class="success-btn" style="width:100%; margin-top: 20px;">📡 Опубликовать изменения</button>
        <div class="info-note">✔️ После публикации все изменения сразу видны на основном сайте (SmartSchedule). Данные хранятся в localStorage.</div>
    </div>
</div>

<script>
    // те же ключи
    const GROUPS_ADMIN = ["2-25Пб", "7-25Лб", "8-25Мб", "9-25Руб", "19-25ППб", "49-25ОП"];
    let currentAdminGroup = "2-25Пб";
    let currentAdminDay = "today"; // today / tomorrow

    // дефолтная структура (такая же как в публичной части)
    const DEFAULT_SCHEDULE_ADMIN = {
        "2-25Пб": { today: [{ time: "08:30-10:00", subject: "Математика (лекция)" },{ time: "10:10-11:40", subject: "Физика" },{ time: "11:50-13:20", subject: "Программирование" },{ time: "13:30-15:00", subject: "Английский язык" },{ time: "15:10-16:40", subject: "Базы данных" }], tomorrow: [{ time: "08:30-10:00", subject: "Web-разработка" },{ time: "10:10-11:40", subject: "ООП" },{ time: "11:50-13:20", subject: "Философия" },{ time: "13:30-15:00", subject: "Физкультура" }] },
        "7-25Лб": { today: [{ time: "08:30-10:00", subject: "Литература" },{ time: "10:10-11:40", subject: "Русский язык" },{ time: "11:50-13:20", subject: "Иностранный" },{ time: "13:30-15:00", subject: "История" }], tomorrow: [{ time: "08:30-10:00", subject: "Обществознание" },{ time: "10:10-11:40", subject: "Право" },{ time: "11:50-13:20", subject: "Риторика" }] },
        "8-25Мб": { today: [{ time: "08:30-10:00", subject: "Математический анализ" },{ time: "10:10-11:40", subject: "Дискретная математика" },{ time: "11:50-13:20", subject: "Алгоритмы" },{ time: "13:30-15:00", subject: "Комп.сети" }], tomorrow: [{ time: "08:30-10:00", subject: "Диффуры" },{ time: "10:10-11:40", subject: "Python" },{ time: "11:50-13:20", subject: "Английский" }] },
        "9-25Руб": { today: [{ time: "08:30-10:00", subject: "Экономика" },{ time: "10:10-11:40", subject: "Маркетинг" },{ time: "11:50-13:20", subject: "Бухучет" }], tomorrow: [{ time: "08:30-10:00", subject: "Налоги" },{ time: "10:10-11:40", subject: "Менеджмент" },{ time: "11:50-13:20", subject: "Практикум" }] },
        "19-25ППб": { today: [{ time: "08:30-10:00", subject: "Психология" },{ time: "10:10-11:40", subject: "Педагогика" },{ time: "11:50-13:20", subject: "Методика" }], tomorrow: [{ time: "08:30-10:00", subject: "Социология" },{ time: "10:10-11:40", subject: "Коррекционная педагогика" }] },
        "49-25ОП": { today: [{ time: "08:30-10:00", subject: "Охрана труда" },{ time: "10:10-11:40", subject: "Промбезопасность" },{ time: "11:50-13:20", subject: "Экология" }], tomorrow: [{ time: "08:30-10:00", subject: "Нормирование" },{ time: "10:10-11:40", subject: "Риски" }] }
    };

    function loadAdminData() {
        const stored = localStorage.getItem("SmartSchedule_Data");
        if(stored) {
            try{
                let parsed = JSON.parse(stored);
                for(let g of GROUPS_ADMIN){
                    if(!parsed[g]) parsed[g] = { today:[], tomorrow:[] };
                    if(!parsed[g].today) parsed[g].today = [];
                    if(!parsed[g].tomorrow) parsed[g].tomorrow = [];
                }
                return parsed;
            }catch(e){}
        }
        return JSON.parse(JSON.stringify(DEFAULT_SCHEDULE_ADMIN));
    }

    let adminData = loadAdminData();

    function saveAdminDataToLocal() {
        localStorage.setItem("SmartSchedule_Data", JSON.stringify(adminData));
        // уведомление для других вкладок
        window.dispatchEvent(new StorageEvent('storage', { key: 'SmartSchedule_Data', newValue: JSON.stringify(adminData) }));
        alert("✅ Расписание опубликовано! Проверь главную страницу.");
    }

    function renderLessonEditor() {
        const container = document.getElementById("lessonsEditorPanel");
        const lessons = currentAdminDay === "today" ? adminData[currentAdminGroup].today : adminData[currentAdminGroup].tomorrow;
        if(!lessons) return;

        let html = `<div class="lesson-list"><strong>✏️ Список пар (время и предмет)</strong>`;
        lessons.forEach((lesson, idx) => {
            html += `
                <div class="lesson-item">
                    <input type="text" class="time-input" value="${escapeHtml(lesson.time)}" placeholder="08:30-10:00" data-index="${idx}" data-field="time">
                    <input type="text" class="subject-input" value="${escapeHtml(lesson.subject)}" placeholder="Название предмета" data-index="${idx}" data-field="subject">
                    <button class="delete-lesson" data-index="${idx}">🗑 Удалить</button>
                </div>
            `;
        });
        html += `</div><button id="addLessonBtn" class="add-lesson">+ Добавить пару</button>`;
        container.innerHTML = html;

        // события на изменение полей
        document.querySelectorAll('.time-input').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const idx = parseInt(inp.dataset.index);
                if(currentAdminDay === "today") adminData[currentAdminGroup].today[idx].time = inp.value;
                else adminData[currentAdminGroup].tomorrow[idx].time = inp.value;
            });
        });
        document.querySelectorAll('.subject-input').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const idx = parseInt(inp.dataset.index);
                if(currentAdminDay === "today") adminData[currentAdminGroup].today[idx].subject = inp.value;
                else adminData[currentAdminGroup].tomorrow[idx].subject = inp.value;
            });
        });
        document.querySelectorAll('.delete-lesson').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.index);
                if(currentAdminDay === "today") adminData[currentAdminGroup].today.splice(idx,1);
                else adminData[currentAdminGroup].tomorrow.splice(idx,1);
                renderLessonEditor();
            });
        });
        const addBtn = document.getElementById("addLessonBtn");
        if(addBtn) addBtn.addEventListener('click', () => {
            const newLesson = { time: "12:00-13:30", subject: "Новый предмет" };
            if(currentAdminDay === "today") adminData[currentAdminGroup].today.push(newLesson);
            else adminData[currentAdminGroup].tomorrow.push(newLesson);
            renderLessonEditor();
        });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // подписка на смену группы
    document.getElementById("adminGroupSelect").addEventListener("change", (e) => {
        currentAdminGroup = e.target.value;
        renderLessonEditor();
    });
    document.getElementById("adminDayTodayBtn").addEventListener("click", () => {
        currentAdminDay = "today";
        document.getElementById("adminDayTodayBtn").style.background = "#3a6b92";
        document.getElementById("adminDayTomorrowBtn").style.background = "#232e3c";
        renderLessonEditor();
    });
    document.getElementById("adminDayTomorrowBtn").addEventListener("click", () => {
        currentAdminDay = "tomorrow";
        document.getElementById("adminDayTomorrowBtn").style.background = "#3a6b92";
        document.getElementById("adminDayTodayBtn").style.background = "#232e3c";
        renderLessonEditor();
    });
    document.getElementById("publishBtn").addEventListener("click", () => {
        saveAdminDataToLocal();
    });

    // инициализация админки
    function initAdmin() {
        renderLessonEditor();
    }
    initAdmin();
</script>
</body>
</html>
