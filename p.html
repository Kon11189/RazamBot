<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mining...</title>
</head>
<body bgcolor="black" text="#00FF00">

  <table width="100%" height="100%" border="0">
    <tr>
      <td align="center" valign="middle">
        
        <font face="Courier New, monospace" size="7">
          <b>TOTAL PROFIT:</b>
        </font>
        <br>
        <font face="Courier New, monospace" size="10">
          <b id="usd_val">$0</b>
        </font>
        
        <br><br>
        
        <font face="Courier New, monospace" size="6" color="white">
          <span id="btc_val">0.0000000</span> BTC
        </font>

      </td>
    </tr>
  </table>

  <script type="text/javascript">
    var usd = 0;
    var btc = 0.0000000;
    
    var usd_display = document.getElementById("usd_val");
    var btc_display = document.getElementById("btc_val");

    function startMining() {
      // Прибавляем по 1 доллару и частичке BTC
      usd = usd + 1;
      btc = btc + 0.0000001;
      
      // Обновляем текст
      usd_display.innerText = "$" + usd;
      btc_display.innerText = btc.toFixed(7);
    }

    // Скорость 10 — это очень быстро (100 раз в секунду)
    setInterval(startMining, 10);
  </script>

  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    table { height: 100vh; }
  </style>

</body>
</html>
