<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Майнинг Центр РЕШОБА</title>
</head>
<body bgcolor="black" text="white">

  <h1 align="center"><font color="#00FF00" face="Courier, monospace" size="10">[ РЕШОБА МАЙНИНГ КОНСОЛЬ v1.0 ]</font></h1>
  
  <br><br>

  <div align="center">
    
    <font face="Courier, monospace">

      <table border="0" cellpadding="20">
        <tr>
          <td align="center">
            <b><font size="6" color="#CCCCCC">Добыто BTC:</font></b>
            <br>
            <b><font size="7" color="white" id="btc_counter">0.0000000</font></b>
          </td>
        </tr>
      </table>

      <br><br>

      <table border="0" cellpadding="20" bgcolor="#222222">
        <tr>
          <td align="center">
            <b><font size="6" color="#CCCCCC">Прибыль в USD:</font></b>
            <br>
            <b><font size="7" color="#00FF00" id="usd_counter">$0</font></b>
          </td>
        </tr>
      </table>

    </font>
  </div>

  <br><br>

  <marquee scrollamount="5" scrolldelay="60" direction="left" behavior="scroll">
    <font face="Courier, monospace" color="green" size="4">
      >> Подключение к пулу... OK // Синхронизация блоков... OK // Майнинг запущен... OK // Ошибок: 0 // Скорость: 1540 TH/s
    </font>
  </marquee>

  <script type="text/javascript">
    // Начальные значения
    var current_btc = 0.0000000;
    var current_usd = 0;

    // Шаги прироста
    var btc_step = 0.0000001;
    var usd_step = 1;

    // Получаем элементы
    var btc_display = document.getElementById("btc_counter");
    var usd_display = document.getElementById("usd_counter");

    // Функция, которая выполняется каждую секунду
    function updateStats() {
      // Увеличиваем значения
      current_btc = current_btc + btc_step;
      current_usd = current_usd + usd_step;

      // Обновляем текст на экране. 
      // btc.toFixed(7) нужно, чтобы всегда было 7 цифр после запятой
      btc_display.innerText = current_btc.toFixed(7);
      usd_display.innerText = "$" + current_usd;
    }

    // Запускаем обновление каждые 1000 миллисекунд (1 секунда)
    setInterval(updateStats, 1000);
  </script>

</body>
</html>
