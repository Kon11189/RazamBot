<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Меню интернет-магазина</title>
    <style>
        /* Добавим немного стилей, чтобы меню выглядело как меню */
        ul { list-style-type: none; }
        li { margin: 5px 0; }
        .category { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <h1>Каталог товаров</h1>

    <ul>
        <li><span class="category">Одежда</span>
            <ul>
                <li>Мужская</li>
                <li>Женская</li>
                <li>Детская</li>
            </ul>
        </li>
        <li><span class="category">Электроника</span>
            <ul>
                <li>Смартфоны</li>
                <li>Ноутбуки</li>
            </ul>
        </li>
        <li><span class="category">Книги</span>
            <ul>
                <li>Художественная литература</li>
                <li>Учебная литература</li>
                <li>Техническая литература</li>
            </ul>
        </li>
    </ul>

</body>
</html>
