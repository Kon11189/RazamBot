<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>SmartSchedule | Расписание занятий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 16px;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* строгий заголовок */
        .header {
            background: white;
            border: 1px solid #e2e8f0;
            border-bottom: 2px solid #cbd5e1;
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
            letter-spacing: -0.3px;
        }

        /* переключатель групп - строгие кнопки */
        .groups-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .group-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: monospace;
            letter-spacing: 0.3px;
        }

        .group-btn.active {
            background: #0f172a;
            border-color: #0f172a;
            color: white;
        }

        .group-btn:hover {
            background: #f1f5f9;
        }

        /* переключатель дней - таб-style */
        .day-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            width: fit-content;
        }

        .day-option {
            padding: 10px 28px;
            background: white;
            border: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            color: #475569;
            transition: all 0.15s;
        }

        .day-option:first-child {
            border-right: 1px solid #e2e8f0;
        }

        .day-option.active {
            background: #0f172a;
            color: white;
        }

        /* инфо-панель - строгий стиль */
        .live-info {
            background: white;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #dc2626;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .current-lesson {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e293b;
        }

        .countdown {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #dc2626;
            background: #fef2f2;
            padding: 6px 14px;
            border: 1px solid #fecaca;
        }

        /* строгая таблица */
        .schedule-wrapper {
            overflow-x: auto;
            background: white;
            border: 1px solid #e2e8f0;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .schedule-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #334155;
            border-bottom: 2px solid #e2e8f0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .schedule-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }

        .time-cell {
            font-weight: 600;
            color: #0f172a;
            font-family: monospace;
            width: 110px;
            white-space: nowrap;
        }

        .subject-cell {
            color: #334155;
        }

        /* подсветка текущего урока */
        .schedule-table tr.current-lesson-row td {
            background: #fef9e3;
            border-left: 3px solid #f59e0b;
        }

        .schedule-table tr.current-lesson-row .time-cell {
            font-weight: 800;
            color: #b45309;
        }

        .schedule-table tr.current-lesson-row .subject-cell {
            font-weight: 600;
            color: #92400e;
        }

        .empty-message {
            text-align: center;
            padding: 48px !important;
            color: #94a3b8;
            font-style: normal;
        }

        /* футер */
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 24px;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 16px;
            }
            .schedule-table th,
            .schedule-table td {
                padding: 10px 12px;
            }
            .time-cell {
                width: 85px;
                font-size: 0.8rem;
            }
            .countdown {
                font-size: 1rem;
                padding: 4px 10px;
            }
            .group-btn {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            .day-option {
                padding: 8px 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 РАСПИСАНИЕ ЗАНЯТИЙ</h1>
    </div>

    <div class="groups-bar" id="groupsBar"></div>

    <div class="day-toggle" id="dayToggle">
        <button class="day-option active" data-day="today">СЕГОДНЯ</button>
        <button class="day-option" data-day="tomorrow">ЗАВТРА</button>
    </div>

    <div class="live-info">
        <span class="current-lesson" id="currentLessonName">—</span>
        <span class="countdown" id="countdownTimer">--:--</span>
    </div>

    <div class="schedule-wrapper">
        <table class="schedule-table">
            <thead>
                <tr><th>ВРЕМЯ</th>
                <th>ПРЕДМЕТ</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
                <tr><td colspan="2" class="empty-message">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="footer-note">
        ⏱ обновление каждую секунду • актуальное расписание
    </div>
</div>

<script>
    const GROUPS = ["2-25Пб", "7-25Лб", "8-25Мб", "9-25Руб", "19-25ППб", "49-25ОП"];
    let currentGroup = "2-25Пб";
    let currentDay = "today";

    const DEFAULT_SCHEDULE = {
        "2-25Пб": {
            today: [
                { time: "08:30-10:00", subject: "Математика (лекция)" },
                { time: "10:10-11:40", subject: "Физика" },
                { time: "11:50-13:20", subject: "Программирование" },
                { time: "13:30-15:00", subject: "Английский язык" },
                { time: "15:10-16:40", subject: "Базы данных" }
            ],
            tomorrow: [
                { time: "08:30-10:00", subject: "Web-разработка" },
                { time: "10:10-11:40", subject: "ООП" },
                { time: "11:50-13:20", subject: "Философия" },
                { time: "13:30-15:00", subject: "Физкультура" }
            ]
        },
        "7-25Лб": {
            today: [
                { time: "08:30-10:00", subject: "Литература" },
                { time: "10:10-11:40", subject: "Русский язык" },
                { time: "11:50-13:20", subject: "Иностранный язык" },
                { time: "13:30-15:00", subject: "История" }
            ],
            tomorrow: [
                { time: "08:30-10:00", subject: "Обществознание" },
                { time: "10:10-11:40", subject: "Право" },
                { time: "11:50-13:20", subject: "Риторика" }
            ]
        },
        "8-25Мб": {
            today: [
                { time: "08:30-10:00", subject: "Математический анализ" },
                { time: "10:10-11:40", subject: "Дискретная математика" },
                { time: "11:50-13:20", subject: "Алгоритмы" },
                { time: "13:30-15:00", subject: "Компьютерные сети" }
            ],
            tomorrow: [
                { time: "08:30-10:00", subject: "Дифференциальные уравнения" },
                { time: "10:10-11:40", subject: "Python программирование" },
                { time: "11:50-13:20", subject: "Английский язык" }
            ]
        },
        "9-25Руб": {
            today: [
                { time: "08:30-10:00", subject: "Экономика" },
                { time: "10:10-11:40", subject: "Маркетинг" },
                { time: "11:50-13:20", subject: "Бухгалтерский учет" }
            ],
            tomorrow: [
                { time: "08:30-10:00", subject: "Налоги и налогообложение" },
                { time: "10:10-11:40", subject: "Менеджмент" },
                { time: "11:50-13:20", subject: "Практикум" }
            ]
        },
        "19-25ППб": {
            today: [
                { time: "08:30-10:00", subject: "Психология" },
                { time: "10:10-11:40", subject: "Педагогика" },
                { time: "11:50-13:20", subject: "Методика преподавания" }
            ],
            tomorrow: [
                { time: "08:30-10:00", subject: "Социология" },
                { time: "10:10-11:40", subject: "Коррекционная педагогика" }
            ]
        },
        "49-25ОП": {
            today: [
                { time: "08:30-10:00", subject: "Охрана труда" },
                { time: "10:10-11:40", subject: "Промышленная безопасность" },
                { time: "11:50-13:20", subject: "Экология" }
            ],
            tomorrow: [
                { time: "08:30-10:00", subject: "Нормирование труда" },
                { time: "10:10-11:40", subject: "Управление рисками" }
            ]
        }
    };

    function loadScheduleData() {
        const stored = localStorage.getItem("SmartSchedule_Data");
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                for (let gr of GROUPS) {
                    if (!parsed[gr]) parsed[gr] = { today: [], tomorrow: [] };
                    if (!parsed[gr].today) parsed[gr].today = [];
                    if (!parsed[gr].tomorrow) parsed[gr].tomorrow = [];
                }
                return parsed;
            } catch(e) { 
                console.warn(e); 
                return JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
            }
        }
        return JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
    }

    let scheduleMaster = loadScheduleData();

    function formatTimeRemaining(minutes, seconds) {
        if (minutes < 0) return "00:00";
        return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function getCurrentLessonInfo(lessons) {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const currentSeconds = now.getSeconds();
        
        for (let i = 0; i < lessons.length; i++) {
            const [start, end] = lessons[i].time.split('-');
            if (!start || !end) continue;
            
            const [startHour, startMin] = start.split(':').map(Number);
            const [endHour, endMin] = end.split(':').map(Number);
            const startTotal = startHour * 60 + startMin;
            const endTotal = endHour * 60 + endMin;
            
            if (currentMinutes >= startTotal && currentMinutes < endTotal) {
                const remainingSeconds = (endTotal * 60) - (currentMinutes * 60 + currentSeconds);
                const remainingMinutes = Math.floor(remainingSeconds / 60);
                const remainingSecs = remainingSeconds % 60;
                return {
                    index: i,
                    subject: lessons[i].subject,
                    endTime: end,
                    remainingMinutes: remainingMinutes,
                    remainingSeconds: remainingSecs,
                    isActive: true
                };
            }
        }
        
        // поиск следующей пары
        for (let i = 0; i < lessons.length; i++) {
            const [start] = lessons[i].time.split('-');
            const [startHour, startMin] = start.split(':').map(Number);
            const startTotal = startHour * 60 + startMin;
            if (startTotal > currentMinutes) {
                const waitMinutes = startTotal - currentMinutes;
                return {
                    index: -1,
                    subject: null,
                    nextStart: lessons[i].time,
                    waitMinutes: waitMinutes,
                    isActive: false,
                    hasNext: true
                };
            }
        }
        
        return { isActive: false, hasNext: false };
    }

    function renderSchedule() {
        const groupData = scheduleMaster[currentGroup] || { today: [], tomorrow: [] };
        let lessons = (currentDay === "today") ? [...groupData.today] : [...groupData.tomorrow];
        const tbody = document.getElementById("scheduleBody");
        
        if (!lessons.length) {
            tbody.innerHTML = `<tr><td colspan="2" class="empty-message">НЕТ ПАР НА ЭТОТ ДЕНЬ</td></tr>`;
            document.getElementById("currentLessonName").innerHTML = "—";
            document.getElementById("countdownTimer").innerHTML = "--:--";
            return;
        }

        let currentInfo = null;
        if (currentDay === "today") {
            currentInfo = getCurrentLessonInfo(lessons);
        }

        let html = "";
        lessons.forEach((lesson, idx) => {
            const isCurrent = (currentDay === "today" && currentInfo && currentInfo.isActive && currentInfo.index === idx);
            const rowClass = isCurrent ? 'current-lesson-row' : '';
            html += `<tr class="${rowClass}">
                        <td class="time-cell">${escapeHtml(lesson.time)}</td>
                        <td class="subject-cell">${escapeHtml(lesson.subject)}</td>
                      </tr>`;
        });
        tbody.innerHTML = html;

        // обновление статуса и таймера
        if (currentDay === "today" && currentInfo) {
            if (currentInfo.isActive) {
                document.getElementById("currentLessonName").innerHTML = `📖 СЕЙЧАС: ${escapeHtml(currentInfo.subject)}`;
                const timeStr = formatTimeRemaining(currentInfo.remainingMinutes, currentInfo.remainingSeconds);
                document.getElementById("countdownTimer").innerHTML = `⏰ ${timeStr}`;
            } else if (currentInfo.hasNext) {
                document.getElementById("currentLessonName").innerHTML = `⏳ ПЕРЕМЕНА`;
                document.getElementById("countdownTimer").innerHTML = `⏰ ДО ПАРЫ: ${currentInfo.waitMinutes} мин`;
            } else {
                document.getElementById("currentLessonName").innerHTML = `✅ ПАРЫ ЗАВЕРШЕНЫ`;
                document.getElementById("countdownTimer").innerHTML = `🎯 ДО ЗАВТРА`;
            }
        } else if (currentDay === "today") {
            document.getElementById("currentLessonName").innerHTML = `📅 СЕГОДНЯ`;
            document.getElementById("countdownTimer").innerHTML = `✨ РАСПИСАНИЕ`;
        } else {
            document.getElementById("currentLessonName").innerHTML = `📆 НА ЗАВТРА`;
            document.getElementById("countdownTimer").innerHTML = `✨ ГОТОВЬСЯ`;
        }
    }

    let timerInterval = null;
    function startLiveTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            renderSchedule();
        }, 1000);
    }

    function escapeHtml(str) { 
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m){
            if(m==='&') return '&amp;';
            if(m==='<') return '&lt;';
            if(m==='>') return '&gt;';
            return m;
        }); 
    }

    function initGroupsUI() {
        const bar = document.getElementById("groupsBar");
        bar.innerHTML = "";
        GROUPS.forEach(gr => {
            const btn = document.createElement("button");
            btn.className = "group-btn" + (currentGroup === gr ? " active" : "");
            btn.innerText = gr;
            btn.addEventListener("click", () => {
                document.querySelectorAll(".group-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentGroup = gr;
                renderSchedule();
            });
            bar.appendChild(btn);
        });
    }

    function initDayToggle() {
        const btns = document.querySelectorAll(".day-option");
        btns.forEach(btn => {
            btn.addEventListener("click", () => {
                btns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentDay = btn.getAttribute("data-day");
                renderSchedule();
            });
        });
    }

    window.addEventListener("storage", (e) => {
        if (e.key === "SmartSchedule_Data") {
            scheduleMaster = loadScheduleData();
            renderSchedule();
        }
    });

    function init() {
        initGroupsUI();
        initDayToggle();
        renderSchedule();
        startLiveTimer();
    }

    init();
</script>
</body>
</html>
